name: "Build Android APK (Umfago & Umfago Driver)"

"on":
  workflow_dispatch:
    inputs:
      target:
        description: "Aplikasi yang ingin dibuild"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "customer"
          - "driver"
      build_type:
        description: "Tipe Build (release atau debug)"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"
  push:
    branches:
      - master
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-customer-apk:
    name: "Customer App APK (${{ github.event.inputs.build_type || 'release' }})"
    if: "${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'customer' }}"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "android/mobile-app/package-lock.json"

      - name: "Setup Java JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: "Accept Android SDK Licenses"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: "Setup Gradle Cache"
        uses: gradle/actions/setup-gradle@v4

      - name: "Install Dependencies"
        working-directory: android/mobile-app
        run: |
          npm ci

      - name: "Configure Production .env"
        working-directory: android/mobile-app
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_APP_NAME=Umfago
          EXPO_PUBLIC_APP_ENV=production
          EXPO_PUBLIC_API_URL=https://umfa-core.fazalabs.sbs
          EXPO_PUBLIC_WS_URL=wss://umfa-core.fazalabs.sbs/ws
          EOF

      - name: "Generate Native Android Project (Expo Prebuild)"
        working-directory: android/mobile-app
        run: |
          npx expo prebuild --platform android --clean

      - name: "Build Customer APK with Gradle"
        working-directory: android/mobile-app/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: "Organize Output APK"
        run: |
          mkdir -p build-output-customer
          find android/mobile-app/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} build-output-customer/ \;
          cd build-output-customer
          for f in *.apk; do
            [ -f "$f" ] && mv "$f" "Umfago-${f}"
          done
          echo "Daftar APK Customer yang berhasil dibuild:"
          ls -lh

      - name: "Upload Customer APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Umfago-Android-APK
          path: build-output-customer/*.apk
          retention-days: 30

  build-driver-apk:
    name: "Driver App APK (${{ github.event.inputs.build_type || 'release' }})"
    if: "${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'driver' }}"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "android/driver-app/package-lock.json"

      - name: "Setup Java JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: "Accept Android SDK Licenses"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: "Setup Gradle Cache"
        uses: gradle/actions/setup-gradle@v4

      - name: "Install Dependencies"
        working-directory: android/driver-app
        run: |
          npm ci

      - name: "Configure Production .env"
        working-directory: android/driver-app
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_APP_NAME=UmfaGo Driver
          EXPO_PUBLIC_APP_ENV=production
          EXPO_PUBLIC_API_URL=https://umfa-core.fazalabs.sbs
          EXPO_PUBLIC_WS_URL=wss://umfa-core.fazalabs.sbs/ws
          EOF

      - name: "Generate Native Android Project (Expo Prebuild)"
        working-directory: android/driver-app
        run: |
          npx expo prebuild --platform android --clean

      - name: "Build Driver APK with Gradle"
        working-directory: android/driver-app/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: "Organize Output APK"
        run: |
          mkdir -p build-output-driver
          find android/driver-app/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} build-output-driver/ \;
          cd build-output-driver
          for f in *.apk; do
            [ -f "$f" ] && mv "$f" "Umfago-Driver-${f}"
          done
          echo "Daftar APK Driver yang berhasil dibuild:"
          ls -lh

      - name: "Upload Driver APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Umfago-Driver-Android-APK
          path: build-output-driver/*.apk
          retention-days: 30
