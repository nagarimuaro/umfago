name: "Build Android APK (Umfago)"

"on":
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipe Build (release atau debug)"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"
  push:
    branches:
      - master
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android-apk:
    name: "Build APK (${{ github.event.inputs.build_type || 'release' }})"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "android/mobile-app/package-lock.json"

      - name: "Setup Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Accept Android SDK Licenses"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: "Setup Gradle Cache"
        uses: gradle/actions/setup-gradle@v4

      - name: "Install Dependencies"
        working-directory: android/mobile-app
        run: |
          npm ci

      - name: "Configure Production .env"
        working-directory: android/mobile-app
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_APP_NAME=Umfago
          EXPO_PUBLIC_APP_ENV=production
          EXPO_PUBLIC_API_URL=https://umfa-core.fazalabs.sbs
          EXPO_PUBLIC_WS_URL=wss://umfa-core.fazalabs.sbs/ws
          EOF

      - name: "Generate Native Android Project (Expo Prebuild)"
        working-directory: android/mobile-app
        run: |
          npx expo prebuild --platform android --clean

      - name: "Build Android APK with Gradle"
        working-directory: android/mobile-app/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: "Organize Output APK"
        run: |
          mkdir -p build-output
          find android/mobile-app/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} build-output/ \;
          cd build-output
          for f in *.apk; do
            [ -f "$f" ] && mv "$f" "Umfago-${f}"
          done
          echo "Daftar APK yang berhasil dibuild:"
          ls -lh

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Umfago-Android-APK
          path: build-output/*.apk
          retention-days: 30
