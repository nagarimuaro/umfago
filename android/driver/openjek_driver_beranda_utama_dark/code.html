<script>
  (function() {
    const quickToggleBtn = document.getElementById('quick-toggle-status');
    const quickStatusText = document.getElementById('quick-status-text');
    let driverState = true;

    if (quickToggleBtn && quickStatusText) {
      quickToggleBtn.addEventListener('click', () => {
        driverState = !driverState;
        if (driverState) {
          quickStatusText.textContent = 'Online';
          quickToggleBtn.querySelector('.material-symbols-outlined').textContent = 'toggle_on';
          quickToggleBtn.querySelector('.material-symbols-outlined').classList.add('text-primary-container');
          quickToggleBtn.querySelector('.material-symbols-outlined').classList.remove('text-on-surface-variant');
        } else {
          quickStatusText.textContent = 'Offline';
          quickToggleBtn.querySelector('.material-symbols-outlined').textContent = 'toggle_off';
          quickToggleBtn.querySelector('.material-symbols-outlined').classList.remove('text-primary-container');
          quickToggleBtn.querySelector('.material-symbols-outlined').classList.add('text-on-surface-variant');
        }
      });
    }
  })();

<script>
        // Simple toggle logic for the Online/Offline status
        const toggleContainer = document.getElementById('toggle-container');
        const toggleThumb = document.getElementById('toggle-thumb');
        const toggleIcon = document.getElementById('toggle-icon');
        const statusText = document.getElementById('status-text');
        const statusCard = document.getElementById('status-card');
        let isOnline = false;

        toggleContainer.addEventListener('click', () => {
            isOnline = !isOnline;
            if (isOnline) {
                // Online State
                toggleThumb.style.transform = 'translateX(100%)';
                toggleThumb.classList.remove('bg-surface-container-lowest');
                toggleThumb.classList.add('bg-primary-container');
                toggleIcon.classList.remove('text-secondary');
                toggleIcon.classList.add('text-on-primary-fixed');
                toggleIcon.classList.add('icon-fill');
                toggleIcon.textContent = 'check_circle';
                
                statusText.textContent = 'Anda sedang Online';
                statusCard.classList.add('border-primary-container');
            } else {
                // Offline State
                toggleThumb.style.transform = 'translateX(0)';
                toggleThumb.classList.add('bg-surface-container-lowest');
                toggleThumb.classList.remove('bg-primary-container');
                toggleIcon.classList.add('text-secondary');
                toggleIcon.classList.remove('text-on-primary-fixed');
                toggleIcon.classList.remove('icon-fill');
                toggleIcon.textContent = 'power_settings_new';
                
                statusText.textContent = 'Anda sedang Offline';
                statusCard.classList.remove('border-primary-container');
            }
        });
    </script>
